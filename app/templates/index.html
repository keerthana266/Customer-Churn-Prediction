<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            padding:50px;
        }

        .container{
            background:white;
            width:500px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#2c3e50;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            background:#3498db;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#2980b9;
        }
    </style>
</head>
<body>

<div class="container">

<h1>Customer Churn Prediction</h1>

<p>Predict whether a customer is likely to leave the service.</p>

<form>

<input type="number" placeholder="Tenure (Months)">

<input type="number" placeholder="Monthly Charges">

<input type="number" placeholder="Total Charges">

<button type="submit">Predict</button>

</form>

</div>

</body>
</html>
