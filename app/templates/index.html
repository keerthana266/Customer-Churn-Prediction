<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            padding:50px;
        }

        .container{
            background:white;
            width:500px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#2c3e50;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            background:#3498db;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:5px;
            margin-top:10px;
        }

        button:hover{
            background:#2980b9;
        }

        h3{
            color:green;
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Customer Churn Prediction</h1>

    <p>Predict whether a customer is likely to leave the service.</p>

    <!-- FIXED FORM -->
    <form action="/predict" method="POST">

        <input type="number" name="tenure" placeholder="Tenure (Months)" required>

        <input type="number" name="monthly_charges" placeholder="Monthly Charges" required>

        <input type="number" name="total_charges" placeholder="Total Charges" required>

        <button type="submit">Predict</button>

    </form>

    <!-- Prediction Output -->
    <h3>{{ prediction_text }}</h3>

</div>

</body>
</html>
